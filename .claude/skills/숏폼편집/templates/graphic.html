<!doctype html>
<!--
  화면 그래픽: 비교 차트 / 트리비아 카드가 애니메이션으로 등장한다.
  ("스케일링 전 80% → 후 10%" 같은 걸 정적 사진 대신 움직이는 인포그래픽으로)

  카드는 원본 영상 위에 얹히는 오버레이다. 영상 길이도 음성도 안 건드린다.
  hyperframes_graphic.py 가 __W__/__H__/__DUR__/__FONT_FILE__/__PROPS_JSON__ 를 채운다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=__W__, height=__H__" />
<style>
  @font-face { font-family: 'HFKR'; src: url('./__FONT_FILE__'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: __W__px; height: __H__px; overflow: hidden;
    background: transparent;
  }
  body { font-family: 'HFKR', sans-serif; -webkit-font-smoothing: antialiased; }

  /* 배경을 살짝 어둡게 깔아 카드가 읽히게 (scrim: false면 안 나온다) */
  #scrim {
    position: absolute; inset: 0; background: #000;
    opacity: 0; animation: scrim-in .35s ease-out both;
  }
  @keyframes scrim-in { to { opacity: var(--scrim-opacity); } }

  #card {
    position: absolute; left: 50%;
    width: var(--card-w);
    padding: 44px 48px 40px;
    border-radius: 32px;
    background: var(--card-bg);
    box-shadow: 0 18px 60px rgba(0, 0, 0, .28);
    opacity: 0;
    transform: translate(-50%, 42px) scale(.96);
    animation: card-in .5s cubic-bezier(.16, 1, .3, 1) .08s both;
  }
  @keyframes card-in { to { opacity: 1; transform: translate(-50%, 0) scale(1); } }

  #title { font-size: var(--title-size); color: var(--title-color); line-height: 1.25; }
  #subtitle { margin-top: 8px; font-size: var(--sub-size); color: var(--sub-color); line-height: 1.3; }
  #rows { margin-top: 30px; }

  .row { margin-top: 22px; }
  .row:first-child { margin-top: 0; }
  .row-head { display: flex; justify-content: space-between; align-items: baseline; }
  .row-label { font-size: var(--label-size); color: var(--label-color); }
  .row-value {
    font-size: var(--value-size);
    opacity: 0; transform: translateY(8px);
    animation: value-in .4s cubic-bezier(.16, 1, .3, 1) both;
  }
  @keyframes value-in { to { opacity: 1; transform: translateY(0); } }

  .track {
    margin-top: 12px; height: var(--bar-h);
    border-radius: calc(var(--bar-h) / 2);
    background: var(--track-color); overflow: hidden;
  }
  .bar {
    height: 100%; border-radius: inherit;
    transform: scaleX(0); transform-origin: left center;
    animation: bar-grow .72s cubic-bezier(.22, 1, .36, 1) both;
  }
  @keyframes bar-grow { to { transform: scaleX(1); } }

  #note {
    margin-top: 26px; font-size: var(--note-size); color: var(--note-color); line-height: 1.4;
    opacity: 0; animation: note-in .4s ease-out both;
  }
  @keyframes note-in { to { opacity: 1; } }
</style>
</head>
<body>
  <div id="root" data-composition-id="root" data-no-timeline
       data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
    <div id="scrim"></div>
    <div id="card">
      <div id="title"></div>
      <div id="subtitle"></div>
      <div id="rows"></div>
      <div id="note"></div>
    </div>
  </div>

  <script id="hf-props" type="application/json">__PROPS_JSON__</script>
  <script>
  (function () {
    var DEFAULTS = {
      title: "스케일링 전 / 후",
      subtitle: "치석 남은 양",
      items: [
        { label: "스케일링 전", value: 80, max: 100, suffix: "%", color: "#8892A6" },
        { label: "스케일링 후", value: 10, max: 100, suffix: "%", color: "#2D6CDF" }
      ],
      note: "",
      scrim: true,
      scrim_opacity: 0.35,
      card_top: 520,
      card_width: 880,
      card_bg: "#FFFFFF",
      title_color: "#111111",
      sub_color: "#6B7280",
      label_color: "#111111",
      track_color: "#EEF1F5",
      note_color: "#6B7280",
      title_size: 54, sub_size: 30, label_size: 34, value_size: 40,
      note_size: 24, bar_height: 28,
      stagger: 0.16                 // 항목마다 이만큼씩 늦게 자란다
    };
    var P;
    try { P = JSON.parse(document.getElementById('hf-props').textContent); }
    catch (e) { P = DEFAULTS; }
    for (var k in DEFAULTS) { if (P[k] === undefined) P[k] = DEFAULTS[k]; }

    var css = document.documentElement.style;
    css.setProperty('--scrim-opacity', P.scrim ? P.scrim_opacity : 0);
    css.setProperty('--card-w', P.card_width + 'px');
    css.setProperty('--card-bg', P.card_bg);
    css.setProperty('--title-color', P.title_color);
    css.setProperty('--sub-color', P.sub_color);
    css.setProperty('--label-color', P.label_color);
    css.setProperty('--track-color', P.track_color);
    css.setProperty('--note-color', P.note_color);
    css.setProperty('--title-size', P.title_size + 'px');
    css.setProperty('--sub-size', P.sub_size + 'px');
    css.setProperty('--label-size', P.label_size + 'px');
    css.setProperty('--value-size', P.value_size + 'px');
    css.setProperty('--note-size', P.note_size + 'px');
    css.setProperty('--bar-h', P.bar_height + 'px');

    if (!P.scrim) document.getElementById('scrim').style.display = 'none';
    document.getElementById('card').style.top = P.card_top + 'px';
    document.getElementById('title').textContent = P.title || '';
    var sub = document.getElementById('subtitle');
    if (P.subtitle) { sub.textContent = P.subtitle; } else { sub.style.display = 'none'; }

    var rows = document.getElementById('rows');
    (P.items || []).forEach(function (item, i) {
      var max = item.max || 100;
      var ratio = Math.max(0, Math.min(1, (item.value || 0) / max));
      var delay = 0.30 + i * P.stagger;

      var row = document.createElement('div');
      row.className = 'row';

      var head = document.createElement('div');
      head.className = 'row-head';
      var label = document.createElement('div');
      label.className = 'row-label';
      label.textContent = item.label || '';
      var value = document.createElement('div');
      value.className = 'row-value';
      value.textContent = (item.value != null ? item.value : '') + (item.suffix || '');
      value.style.color = item.color || P.label_color;
      value.style.animationDelay = (delay + 0.30) + 's';
      head.appendChild(label);
      head.appendChild(value);

      var track = document.createElement('div');
      track.className = 'track';
      var bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.background = item.color || '#2D6CDF';
      bar.style.width = (ratio * 100) + '%';
      bar.style.animationDelay = delay + 's';
      track.appendChild(bar);

      row.appendChild(head);
      row.appendChild(track);
      rows.appendChild(row);
    });

    var note = document.getElementById('note');
    if (P.note) {
      note.textContent = P.note;
      note.style.animationDelay = (0.30 + (P.items || []).length * P.stagger + 0.35) + 's';
    } else {
      note.style.display = 'none';
    }
  })();
  </script>
</body>
</html>
