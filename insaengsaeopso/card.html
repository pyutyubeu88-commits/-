<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>인생사업소 소개카드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1500px}
  body{
    font-family:'Noto Sans KR',sans-serif;
    background:linear-gradient(160deg,#0F2A1F 0%,#1B4332 55%,#2D6A4F 100%);
    color:#fff;position:relative;overflow:hidden;
  }
  body::before{
    content:'';position:absolute;top:-140px;right:-140px;
    width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle,rgba(116,198,157,.18) 0%,transparent 70%);
  }
  body::after{
    content:'';position:absolute;bottom:-160px;left:-120px;
    width:460px;height:460px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,183,3,.10) 0%,transparent 70%);
  }
  .wrap{position:relative;z-index:2;padding:64px 80px 32px;height:100%;display:flex;flex-direction:column}

  .lbl{
    font-size:20px;font-weight:700;letter-spacing:4px;
    color:#74C69D;margin-bottom:22px;
  }
  h1{
    font-size:92px;font-weight:900;letter-spacing:-2px;line-height:1.08;
    margin-bottom:26px;
  }
  .tagline{
    font-size:32px;font-weight:500;color:rgba(255,255,255,.82);
    line-height:1.55;margin-bottom:40px;
  }
  .tagline b{color:#FFB703;font-weight:700}

  .profile-row{
    display:flex;align-items:center;gap:32px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);
    border-radius:24px;padding:32px 36px;margin-bottom:36px;
  }
  .profile-row img{
    width:120px;height:120px;border-radius:50%;object-fit:cover;
    object-position:50% 15%;
    border:3px solid rgba(255,183,3,.55);flex-shrink:0;
  }
  .p-name{font-size:34px;font-weight:900;letter-spacing:-.5px}
  .p-bio{font-size:22px;color:rgba(255,255,255,.68);margin-top:8px;line-height:1.5}

  .points{display:flex;flex-direction:column;gap:10px}
  .point{display:flex;align-items:flex-start;gap:16px;font-size:26px;color:rgba(255,255,255,.9);line-height:1.5}
  .point .dot{
    width:34px;height:34px;border-radius:10px;background:rgba(116,198,157,.22);
    border:1px solid rgba(116,198,157,.45);color:#74C69D;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;
    flex-shrink:0;margin-top:3px;
  }

  .credential{margin-top:24px;text-align:center}
  .cred-lbl{font-size:18px;font-weight:700;letter-spacing:2px;color:#74C69D;margin-bottom:14px}
  .cred-card{
    width:560px;max-width:100%;margin:0 auto;border-radius:14px;overflow:hidden;
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 10px 24px rgba(0,0,0,.28);
    display:block;
  }
  .cred-card img{width:100%;display:block}

  .contact{
    margin-top:40px;border-top:1px solid rgba(255,255,255,.16);
    padding-top:28px;display:flex;flex-direction:column;gap:10px;
  }
  .c-row{display:flex;align-items:center;gap:14px;font-size:28px;font-weight:700}
  .c-icon{font-size:26px}
  .c-note{font-size:20px;color:rgba(255,255,255,.55);margin-top:6px;font-weight:400}
</style>
</head>
<body>
  <div class="wrap">
    <div class="lbl">PERSONAL MENTORING</div>
    <h1>인생사업소</h1>
    <div class="tagline">사업이든 인생이든,<br><b>편하게</b> 물어봐.</div>

    <div class="profile-row">
      <img src="profile-id-sq.jpg" alt="권용준">
      <div>
        <div class="p-name">권용준</div>
        <div class="p-bio">13년째 사람들 얘기 듣고<br>같이 답 찾아온 사람</div>
      </div>
    </div>

    <div class="points">
      <div class="point"><span class="dot">01</span>사업 고민이든, 사는 얘기든 다 괜찮아</div>
      <div class="point"><span class="dot">02</span>듣기만 하지 않고, 같이 방향을 찾아드려요</div>
      <div class="point"><span class="dot">03</span>강남 근처면 대면으로, 편한 시간에</div>
    </div>

    <div class="credential">
      <div class="cred-lbl">강남구 공식 지정 AI 컨설턴트</div>
      <div class="cred-card"><img src="business-card.jpg" alt="강남구 AI 컨설턴트 권용준 명함"></div>
    </div>

    <div class="contact">
      <div class="c-row"><span class="c-icon">📞</span> 010-6783-2588</div>
      <div class="c-note">이 번호로 문자·카톡 주시면 편한 시간 잡아드릴게요.</div>
    </div>
  </div>
</body>
</html>
